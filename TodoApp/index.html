<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task List</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container py-4">

        <!-- CARD CHÍNH -->
        <div class="card shadow-sm">
            <div class="card-body">

                <!-- HEADER -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="fw-bold mb-0">Task List</h4>
                    <button class="btn btn-primary btn-sm px-3" id="btnMoForm" style="background-color: blueviolet;">
                        <i class="bi bi-plus"></i> Add Task
                    </button>
                </div>

                <!-- DANH SÁCH TASK -->
                <div id="taskList">
                    <!-- JS render vào đây -->
                </div>

            </div>
        </div>

        <!-- FORM THÊM TASK (ẩn mặc định) -->
        <div class="card shadow-sm mt-3" id="formCard" style="display:none;">
            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="fw-bold mb-0">Add Task</h6>
                    <button type="button" class="btn-close" id="btnDongForm"></button>
                </div>

                <form id="formTask">
                    <!-- Task name -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Task</label>
                        <input type="text" class="form-control" id="inputTask" placeholder="Type your task here..." />
                        <!-- Thông báo lỗi validation -->
                        <div id="errorTask" class="text-danger small mt-1" style="display:none;"></div>
                    </div>

                    <!-- Priority -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Priority</label>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-sm btn-priority active-priority" id="btnHigh" onclick="chonPriority('High')">High</button>
                            <button type="button" class="btn btn-sm btn-priority" id="btnMedium" onclick="chonPriority('Medium')">Medium</button>
                            <button type="button" class="btn btn-sm btn-priority" id="btnLow" onclick="chonPriority('Low')">Low</button>
                        </div>
                    </div>

                    <div class="text-end">
                        <button type="submit" class="btn btn-dark btn-sm px-4">Add</button>
                    </div>
                </form>

            </div>
        </div>

    </div>

    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>

</html>
